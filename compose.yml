services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: billkaro_app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: billkaro
      DB_USER: billkaro
      DB_PASSWORD: ${DB_PASSWORD}
      SECRET_KEY: ${SECRET_KEY}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - billkaro_net

  db:
    image: mysql:8.0
    container_name: billkaro_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: billkaro
      MYSQL_USER: billkaro
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - billkaro_net

volumes:
  db_data:

networks:
  billkaro_net:
    driver: bridge
